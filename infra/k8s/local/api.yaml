apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: simlab
spec:
  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: api
          image: simlab-api:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: simlab-config

          env:
            - name: PORT
              value: "3000"
            - name: AZURE_CONFIG_DIR
              value: /azure-config

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5

          volumeMounts:
            - name: azure-config
              mountPath: /azure-config

      volumes:
        - name: azure-config
          hostPath:
            path: /azure-config
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: simlab
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http