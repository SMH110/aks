apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.ui.replicas }}

  selector:
    matchLabels:
      app: ui

  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: simlab-ui:dev
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80

          env:
            - name: API_UPSTREAM
              value: "api:3000"

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: simlab
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: http